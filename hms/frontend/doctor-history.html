<html lang="en">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="staff.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1E3A8A" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav">
      <li><a href="staff.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="doctor-appointments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> My Appointments</a></li>
      <li><a href="laboratory.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6L4 20a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L15 8V2"/><path d="M9 2h6M6 15h12"/></svg> Laboratory</a></li>
      <li><a href="doctor-history.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg> History</a></li>
      <li><a href="notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>Treatment History</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="panel">
        <div class="panel-head"><h2>Completed visits</h2></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Patient</th><th>Date</th><th>Reason</th><th>Medicines Prescribed</th><th>Notes</th></tr></thead>
            <tbody id="history-body"><tr><td colspan="5"><div class="skeleton skel-row"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["DOCTOR"]);
if (user) {
  renderUserChip();
  loadNotifBadge();
  load();
}

async function load() {
  try {
    const doctor = await api("/doctors/me?userId=" + user.userId);
    const [appointments, patients, prescriptions] = await Promise.all([
      api(`/appointments/doctor/${doctor.id}`),
      api(`/patients/by-doctor/${doctor.id}`),
      api(`/prescriptions/doctor/${doctor.id}`)
    ]);

    const completed = appointments.filter(a => a.status === "COMPLETED").sort((a, b) => b.id - a.id);
    const body = document.getElementById("history-body");

    body.innerHTML = completed.length === 0
      ? `<tr class="empty-row"><td colspan="5">No completed visits yet.</td></tr>`
      : completed.map(a => {
          const patient = patients.find(p => p.id === a.patientId);
          const rx = prescriptions.find(p => p.appointmentId === a.id);
          return `<tr>
            <td>${patient ? escapeHtml(patient.name) : "Patient #" + a.patientId}</td>
            <td>${formatDate(a.date)}</td>
            <td>${a.reason ? escapeHtml(a.reason) : "—"}</td>
            <td>${rx ? escapeHtml(rx.medicines) : "—"}</td>
            <td>${rx && rx.notes ? escapeHtml(rx.notes) : "—"}</td>
          </tr>`;
        }).join("");
  } catch (err) {
    toast(err.message, "error");
  }
}
</script>
</body>
</html>

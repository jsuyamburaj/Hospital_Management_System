<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="staff.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2c7be5" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav" id="side-nav">
      <!-- populated by script based on role -->
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card blue"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card green"><div class="skeleton" style="height:70px;"></div></div>
      </div>

      <!-- DOCTOR VIEW -->
      <div id="doctor-view" style="display:none;">
        <div class="panel">
          <div class="panel-head"><h2>My Appointments</h2></div>
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Patient</th><th>Date</th><th>Reason</th><th>Status</th><th></th></tr></thead>
              <tbody id="doctor-appts-body"><tr><td colspan="5"><div class="skeleton skel-row"></div></td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>My Patients</h2></div>
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Name</th><th>Age</th><th>Disease</th><th>Contact</th></tr></thead>
              <tbody id="doctor-patients-body"><tr><td colspan="4"><div class="skeleton skel-row"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- BILLING STAFF VIEW -->
      <div id="billing-view" style="display:none;">
        <div class="panel">
          <div class="panel-head">
            <h2>Recent Bills</h2>
            <a href="billing.html" class="btn btn-outline btn-sm">Manage all billing</a>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Patient ID</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
              <tbody id="billing-recent-body"><tr><td colspan="4"><div class="skeleton skel-row"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["DOCTOR", "BILLING_STAFF"]);
if (user) {
  renderUserChip();
  buildSidebar();
  if (user.role === "DOCTOR") {
    document.getElementById("page-title").textContent = "Doctor Dashboard";
    document.getElementById("doctor-view").style.display = "block";
    loadDoctorView();
  } else {
    document.getElementById("page-title").textContent = "Billing Dashboard";
    document.getElementById("billing-view").style.display = "block";
    loadBillingView();
  }
}

function buildSidebar() {
  const nav = document.getElementById("side-nav");
  if (user.role === "DOCTOR") {
    nav.innerHTML = `
      <li><a href="staff.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>`;
  } else {
    nav.innerHTML = `
      <li><a href="staff.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Billing</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>`;
  }
}

async function loadDoctorView() {
  try {
    const doctor = await api("/doctors/me?userId=" + user.userId);
    const [appointments, patients] = await Promise.all([
      api(`/appointments/doctor/${doctor.id}`),
      api(`/patients/by-doctor/${doctor.id}`)
    ]);
    document.getElementById("stat-cards").innerHTML = `
      <div class="stat-card blue">
        <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div></div>
        <div class="value">${appointments.length}</div><div class="label">My Appointments</div>
      </div>
      <div class="stat-card green">
        <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div></div>
        <div class="value">${patients.length}</div><div class="label">Assigned Patients</div>
      </div>`;

    const apptBody = document.getElementById("doctor-appts-body");
    if (appointments.length === 0) {
      apptBody.innerHTML = `<tr class="empty-row"><td colspan="5">No appointments assigned yet.</td></tr>`;
    } else {
      apptBody.innerHTML = [...appointments].sort((a,b) => b.id - a.id).map(a => {
        const patient = patients.find(p => p.id === a.patientId);
        const isActionable = a.status === "APPROVED";
        return `<tr>
          <td>${patient ? escapeHtml(patient.name) : "Patient #" + a.patientId}</td>
          <td>${formatDate(a.date)}</td>
          <td>${a.reason ? escapeHtml(a.reason) : "—"}</td>
          <td><span class="badge ${statusBadgeClass(a.status)}">${a.status.toLowerCase()}</span></td>
          <td>${isActionable ? `<button class="btn btn-outline btn-sm" onclick="markCompleted(${a.id})">Mark Completed</button>` : ""}</td>
        </tr>`;
      }).join("");
    }

    const patientsBody = document.getElementById("doctor-patients-body");
    patientsBody.innerHTML = patients.length === 0
      ? `<tr class="empty-row"><td colspan="4">No patients assigned yet.</td></tr>`
      : patients.map(p => `<tr>
          <td>${escapeHtml(p.name)}</td><td>${p.age ?? "—"}</td>
          <td>${p.disease ? escapeHtml(p.disease) : "—"}</td>
          <td>${p.phone ? escapeHtml(p.phone) : (p.email ? escapeHtml(p.email) : "—")}</td>
        </tr>`).join("");
  } catch (err) {
    toast(err.message, "error");
  }
}

async function markCompleted(id) {
  try {
    await api(`/appointments/${id}/status`, { method: "PUT", body: { status: "COMPLETED" } });
    toast("Appointment marked as completed.", "success");
    loadDoctorView();
  } catch (err) {
    toast(err.message, "error");
  }
}

async function loadBillingView() {
  try {
    const billings = await api("/billing");
    const paid = billings.filter(b => b.status === "PAID").length;
    const unpaid = billings.filter(b => b.status === "UNPAID").length;
    document.getElementById("stat-cards").innerHTML = `
      <div class="stat-card blue">
        <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div></div>
        <div class="value">${billings.length}</div><div class="label">Total Bills</div>
      </div>
      <div class="stat-card green">
        <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div></div>
        <div class="value">${paid} / ${unpaid}</div><div class="label">Paid / Unpaid</div>
      </div>`;

    const body = document.getElementById("billing-recent-body");
    const recent = [...billings].sort((a, b) => b.id - a.id).slice(0, 8);
    body.innerHTML = recent.length === 0
      ? `<tr class="empty-row"><td colspan="4">No billing records yet.</td></tr>`
      : recent.map(b => `<tr>
          <td>#${b.patientId}</td><td>${formatCurrency(b.amount)}</td><td>${formatDate(b.date)}</td>
          <td><span class="badge ${statusBadgeClass(b.status)}">${b.status.toLowerCase()}</span></td>
        </tr>`).join("");
  } catch (err) {
    toast(err.message, "error");
  }
}
</script>
</body>
</html>

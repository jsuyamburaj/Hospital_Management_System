<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="admin.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2c7be5" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav">
      <li><a href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="patients.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Patients</a></li>
      <li><a href="doctors.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg> Doctors</a></li>
      <li><a href="appointments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Appointments</a></li>
      <li><a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Billing</a></li>
      <li><a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg> Reports</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>Patients</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="panel">
        <div class="panel-head">
          <h2>All patients</h2>
          <div class="toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" id="search-input" placeholder="Search patients...">
            </div>
            <button class="btn btn-primary btn-sm" id="add-patient-btn">+ Add Patient</button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Age</th><th>Disease</th><th>Assigned Doctor</th><th>Contact</th><th></th></tr></thead>
            <tbody id="patients-body">
              <tr><td colspan="6"><div class="skeleton skel-row"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Patient Modal -->
<div class="modal-overlay" id="patient-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="patient-modal-title">Add Patient</h3>
      <button class="modal-close" data-close-modal="patient-modal">&times;</button>
    </div>
    <form id="patient-form">
      <input type="hidden" id="patient-id">
      <div class="field" id="f-p-name">
        <label for="p-name">Full name</label>
        <input type="text" id="p-name" placeholder="Jordan Lee">
        <div class="error-text">Name is required.</div>
      </div>
      <div class="field-row">
        <div class="field" id="f-p-age">
          <label for="p-age">Age</label>
          <input type="number" id="p-age" min="0" placeholder="32">
        </div>
        <div class="field" id="f-p-doctor">
          <label for="p-doctor">Assigned doctor</label>
          <select id="p-doctor"><option value="">Unassigned</option></select>
        </div>
      </div>
      <div class="field" id="f-p-disease">
        <label for="p-disease">Disease / reason</label>
        <input type="text" id="p-disease" placeholder="e.g. Hypertension">
      </div>
      <div class="field-row">
        <div class="field" id="f-p-email">
          <label for="p-email">Email</label>
          <input type="email" id="p-email" placeholder="Optional">
        </div>
        <div class="field" id="f-p-phone">
          <label for="p-phone">Phone</label>
          <input type="text" id="p-phone" placeholder="Optional">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="patient-save-btn">Save Patient</button>
    </form>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["ADMIN"]);
let allPatients = [];
let allDoctors = [];

if (user) {
  renderUserChip();
  loadPatients();
}

async function loadPatients() {
  try {
    [allPatients, allDoctors] = await Promise.all([api("/patients"), api("/doctors")]);
    populateDoctorSelect();
    renderPatients(allPatients);
  } catch (err) {
    toast(err.message, "error");
  }
}

function populateDoctorSelect() {
  const select = document.getElementById("p-doctor");
  select.innerHTML = '<option value="">Unassigned</option>' +
    allDoctors.map(d => `<option value="${d.id}">${escapeHtml(d.name)} — ${escapeHtml(d.specialization)}</option>`).join("");
}

function renderPatients(list) {
  const body = document.getElementById("patients-body");
  if (list.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="6">No patients found.</td></tr>`;
    return;
  }
  body.innerHTML = list.map(p => {
    const doctor = allDoctors.find(d => d.id === p.doctorId);
    return `<tr>
      <td>${escapeHtml(p.name)}</td>
      <td>${p.age ?? "—"}</td>
      <td>${p.disease ? escapeHtml(p.disease) : "—"}</td>
      <td>${doctor ? escapeHtml(doctor.name) : '<span class="badge badge-gray">Unassigned</span>'}</td>
      <td>${p.phone ? escapeHtml(p.phone) : (p.email ? escapeHtml(p.email) : "—")}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" onclick="editPatient(${p.id})" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="icon-btn danger" onclick="deletePatient(${p.id})" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg></button>
        </div>
      </td>
    </tr>`;
  }).join("");
}

document.getElementById("search-input").addEventListener("input", async (e) => {
  const term = e.target.value.trim();
  try {
    const results = term ? await api("/patients?search=" + encodeURIComponent(term)) : allPatients;
    renderPatients(results);
  } catch (err) {
    toast(err.message, "error");
  }
});

document.getElementById("add-patient-btn").addEventListener("click", () => {
  document.getElementById("patient-form").reset();
  document.getElementById("patient-id").value = "";
  document.getElementById("patient-modal-title").textContent = "Add Patient";
  clearAllErrors(document.getElementById("patient-form"));
  openModal("patient-modal");
});

function editPatient(id) {
  const p = allPatients.find(x => x.id === id);
  if (!p) return;
  document.getElementById("patient-id").value = p.id;
  document.getElementById("p-name").value = p.name || "";
  document.getElementById("p-age").value = p.age ?? "";
  document.getElementById("p-doctor").value = p.doctorId ?? "";
  document.getElementById("p-disease").value = p.disease || "";
  document.getElementById("p-email").value = p.email || "";
  document.getElementById("p-phone").value = p.phone || "";
  document.getElementById("patient-modal-title").textContent = "Edit Patient";
  clearAllErrors(document.getElementById("patient-form"));
  openModal("patient-modal");
}

async function deletePatient(id) {
  if (!confirm("Remove this patient record? This cannot be undone.")) return;
  try {
    await api(`/patients/${id}`, { method: "DELETE" });
    toast("Patient removed.", "success");
    loadPatients();
  } catch (err) {
    toast(err.message, "error");
  }
}

document.getElementById("patient-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  clearAllErrors(form);

  const name = document.getElementById("p-name").value.trim();
  if (!name) { showFieldError(document.getElementById("f-p-name"), "Name is required."); return; }

  const id = document.getElementById("patient-id").value;
  const payload = {
    name,
    age: document.getElementById("p-age").value ? Number(document.getElementById("p-age").value) : null,
    doctorId: document.getElementById("p-doctor").value ? Number(document.getElementById("p-doctor").value) : null,
    disease: document.getElementById("p-disease").value.trim() || null,
    email: document.getElementById("p-email").value.trim() || null,
    phone: document.getElementById("p-phone").value.trim() || null
  };

  const btn = document.getElementById("patient-save-btn");
  btn.disabled = true;

  try {
    if (id) {
      await api(`/patients/${id}`, { method: "PUT", body: payload });
      toast("Patient updated.", "success");
    } else {
      await api("/patients", { method: "POST", body: payload });
      toast("Patient added.", "success");
    }
    closeModal("patient-modal");
    loadPatients();
  } catch (err) {
    toast(err.message, "error");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>

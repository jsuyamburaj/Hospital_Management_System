<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="admin.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2c7be5" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav">
      <li><a href="admin.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="patients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Patients</a></li>
      <li><a href="doctors.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg> Doctors</a></li>
      <li><a href="appointments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Appointments</a></li>
      <li><a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Billing</a></li>
      <li><a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg> Reports</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>Admin Dashboard</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card blue"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card green"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card warning"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card danger"><div class="skeleton" style="height:70px;"></div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Recent Appointments</h2>
          <a href="appointments.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="recent-appointments-body">
              <tr><td colspan="4"><div class="skeleton skel-row"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Recent Bills</h2>
          <a href="billing.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Patient ID</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="recent-billing-body">
              <tr><td colspan="4"><div class="skeleton skel-row"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["ADMIN"]);
if (user) {
  renderUserChip();
  loadDashboard();
}

async function loadDashboard() {
  try {
    const summary = await api("/admin/dashboard");
    renderStatCards(summary);
  } catch (err) {
    toast(err.message, "error");
  }

  try {
    const [appointments, doctors, patients, billings] = await Promise.all([
      api("/appointments"),
      api("/doctors"),
      api("/patients"),
      api("/billing")
    ]);
    renderRecentAppointments(appointments, doctors, patients);
    renderRecentBilling(billings);
  } catch (err) {
    toast(err.message, "error");
  }
}

function renderStatCards(summary) {
  const el = document.getElementById("stat-cards");
  el.innerHTML = `
    <div class="stat-card blue">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div></div>
      <div class="value">${summary.totalPatients}</div><div class="label">Total Patients</div>
    </div>
    <div class="stat-card green">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg></div></div>
      <div class="value">${summary.totalDoctors}</div><div class="label">Total Doctors</div>
    </div>
    <div class="stat-card warning">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div></div>
      <div class="value">${summary.totalAppointments}</div><div class="label">Total Appointments</div>
    </div>
    <div class="stat-card danger">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div></div>
      <div class="value">${formatCurrency(summary.totalRevenue)}</div><div class="label">Total Revenue</div>
    </div>`;
}

function renderRecentAppointments(appointments, doctors, patients) {
  const body = document.getElementById("recent-appointments-body");
  const recent = [...appointments].sort((a, b) => b.id - a.id).slice(0, 6);
  if (recent.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="4">No appointments yet.</td></tr>`;
    return;
  }
  body.innerHTML = recent.map(a => {
    const patient = patients.find(p => p.id === a.patientId);
    const doctor = doctors.find(d => d.id === a.doctorId);
    return `<tr>
      <td>${patient ? escapeHtml(patient.name) : "Patient #" + a.patientId}</td>
      <td>${doctor ? escapeHtml(doctor.name) : "Doctor #" + a.doctorId}</td>
      <td>${formatDate(a.date)}</td>
      <td><span class="badge ${statusBadgeClass(a.status)}">${a.status.toLowerCase()}</span></td>
    </tr>`;
  }).join("");
}

function renderRecentBilling(billings) {
  const body = document.getElementById("recent-billing-body");
  const recent = [...billings].sort((a, b) => b.id - a.id).slice(0, 6);
  if (recent.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="4">No billing records yet.</td></tr>`;
    return;
  }
  body.innerHTML = recent.map(b => `<tr>
      <td>#${b.patientId}</td>
      <td>${formatCurrency(b.amount)}</td>
      <td>${formatDate(b.date)}</td>
      <td><span class="badge ${statusBadgeClass(b.status)}">${b.status.toLowerCase()}</span></td>
    </tr>`).join("");
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reception — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="index.html" class="brand" id="brand-link">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1E3A8A" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav" id="side-nav"></ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>Reception</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card blue"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card green"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card warning"><div class="skeleton" style="height:70px;"></div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Today's queue</h2>
          <div class="toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" id="search-input" placeholder="Search patient or doctor...">
            </div>
          </div>
        </div>
        <p class="pill-note">Shows every appointment scheduled for today, across all doctors. Check patients in as they arrive.</p>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th><th>Arrival</th><th></th></tr></thead>
            <tbody id="queue-body"><tr><td colspan="6"><div class="skeleton skel-row"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["ADMIN", "BILLING_STAFF"]);
let todaysAppointments = [];
let allPatients = [];
let allDoctors = [];

if (user) {
  document.getElementById("brand-link").href = user.role === "ADMIN" ? "admin.html" : "staff.html";
  renderUserChip();
  loadNotifBadge();
  buildSidebar();
  loadQueue();
}

function buildSidebar() {
  HMSComponents.initLayout();
}

async function loadQueue() {
  try {
    const [appointments, patients, doctors] = await Promise.all([api("/appointments"), api("/patients"), api("/doctors")]);
    allPatients = patients;
    allDoctors = doctors;

    const today = new Date().toISOString().slice(0, 10);
    todaysAppointments = appointments.filter(a => a.date === today && a.status !== "REJECTED");

    renderStats();
    renderQueue(todaysAppointments);
  } catch (err) {
    toast(err.message, "error");
  }
}

function renderStats() {
  const checkedIn = todaysAppointments.filter(a => a.checkedIn).length;
  const waiting = todaysAppointments.filter(a => !a.checkedIn).length;
  document.getElementById("stat-cards").innerHTML = `
    <div class="stat-card blue">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div></div>
      <div class="value">${todaysAppointments.length}</div><div class="label">Scheduled Today</div>
    </div>
    <div class="stat-card green">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div></div>
      <div class="value">${checkedIn}</div><div class="label">Checked In</div>
    </div>
    <div class="stat-card warning">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div></div>
      <div class="value">${waiting}</div><div class="label">Waiting to Arrive</div>
    </div>`;
}

function renderQueue(list) {
  const body = document.getElementById("queue-body");
  if (list.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="6">No appointments scheduled for today.</td></tr>`;
    return;
  }
  body.innerHTML = list.map(a => {
    const patient = allPatients.find(p => p.id === a.patientId);
    const doctor = allDoctors.find(d => d.id === a.doctorId);
    return `<tr>
      <td>${patient ? escapeHtml(patient.name) : "Patient #" + a.patientId}</td>
      <td>${doctor ? escapeHtml(doctor.name) : "Doctor #" + a.doctorId}</td>
      <td>${a.reason ? escapeHtml(a.reason) : "—"}</td>
      <td><span class="badge ${statusBadgeClass(a.status)}">${a.status.toLowerCase()}</span></td>
      <td>${a.checkedIn ? '<span class="badge badge-green">arrived</span>' : '<span class="badge badge-gray">waiting</span>'}</td>
      <td>${!a.checkedIn ? `<button class="btn btn-primary btn-sm" onclick="checkIn(${a.id})">Check In</button>` : ""}</td>
    </tr>`;
  }).join("");
}

document.getElementById("search-input").addEventListener("input", (e) => {
  const term = e.target.value.trim().toLowerCase();
  const filtered = term ? todaysAppointments.filter(a => {
    const patient = allPatients.find(p => p.id === a.patientId);
    const doctor = allDoctors.find(d => d.id === a.doctorId);
    return (patient && patient.name.toLowerCase().includes(term)) || (doctor && doctor.name.toLowerCase().includes(term));
  }) : todaysAppointments;
  renderQueue(filtered);
});

async function checkIn(id) {
  try {
    await api(`/appointments/${id}/check-in`, { method: "PUT" });
    toast("Patient checked in.", "success");
    loadQueue();
  } catch (err) {
    toast(err.message, "error");
  }
}
</script>
</body>
</html>

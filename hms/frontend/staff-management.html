<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="admin.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1E3A8A" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav">
      <li><a href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="patients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Patients</a></li>
      <li><a href="staff-management.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Staff</a></li>
      <li><a href="appointments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Appointments</a></li>
      <li><a href="reception.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> Reception</a></li>
      <li><a href="admissions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg> Inpatient/Outpatient</a></li>
      <li><a href="pharmacy.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 4.5l15 15M9 3.5a4 4 0 0 1 5.66 0l5.84 5.84a4 4 0 0 1-5.66 5.66L9 9.16A4 4 0 0 1 9 3.5z"/></svg> Pharmacy</a></li>
      <li><a href="laboratory.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6L4 20a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L15 8V2"/><path d="M9 2h6M6 15h12"/></svg> Laboratory</a></li>
      <li><a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Billing</a></li>
      <li><a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg> Reports</a></li>

      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>Staff Management</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card blue"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card green"><div class="skeleton" style="height:70px;"></div></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="all">All Staff</button>
        <button class="tab-btn" data-tab="doctors">Doctors</button>
        <button class="tab-btn" data-tab="billing">Billing Staff</button>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Directory</h2>
          <div class="toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" id="search-input" placeholder="Search staff...">
            </div>
            <a href="doctors.html" class="btn btn-outline btn-sm">Manage Doctors</a>
            <a href="billing-staff.html" class="btn btn-outline btn-sm">Manage Billing Staff</a>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Role</th><th>Detail</th><th>Contact</th></tr></thead>
            <tbody id="staff-body"><tr><td colspan="4"><div class="skeleton skel-row"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["ADMIN"]);
let allStaff = [];
let activeTab = "all";

if (user) {
  renderUserChip();
  loadNotifBadge();
  loadStaff();
}

async function loadStaff() {
  try {
    const [doctors, billingStaff] = await Promise.all([api("/doctors"), api("/staff/billing")]);
    allStaff = [
      ...doctors.map(d => ({ kind: "Doctor", name: d.name, detail: d.specialization, contact: d.phone || d.email || "—" })),
      ...billingStaff.map(s => ({ kind: "Billing Staff", name: s.name, detail: s.email, contact: s.phone || s.email || "—" }))
    ];
    renderStats(doctors.length, billingStaff.length);
    render();
  } catch (err) {
    toast(err.message, "error");
  }
}

function renderStats(doctorCount, billingCount) {
  document.getElementById("stat-cards").innerHTML = `
    <div class="stat-card blue">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg></div></div>
      <div class="value">${doctorCount}</div><div class="label">Doctors</div>
    </div>
    <div class="stat-card green">
      <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div></div>
      <div class="value">${billingCount}</div><div class="label">Billing Staff</div>
    </div>`;
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    render();
  });
});

function render() {
  const term = document.getElementById("search-input").value.trim().toLowerCase();
  let list = allStaff;
  if (activeTab === "doctors") list = list.filter(s => s.kind === "Doctor");
  if (activeTab === "billing") list = list.filter(s => s.kind === "Billing Staff");
  if (term) list = list.filter(s => s.name.toLowerCase().includes(term));

  const body = document.getElementById("staff-body");
  if (list.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="4">No staff found.</td></tr>`;
    return;
  }
  body.innerHTML = list.map(s => `<tr>
      <td>${escapeHtml(s.name)}</td>
      <td><span class="badge ${s.kind === 'Doctor' ? 'badge-blue' : 'badge-green'}">${s.kind}</span></td>
      <td>${escapeHtml(s.detail || "—")}</td>
      <td>${escapeHtml(s.contact)}</td>
    </tr>`).join("");
}

document.getElementById("search-input").addEventListener("input", render);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1E3A8A" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav">
      <li><a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="appointment-book.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Book Appointment</a></li>
      <li><a href="laboratory.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6L4 20a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L15 8V2"/><path d="M9 2h6M6 15h12"/></svg> My Lab Tests</a></li>
      <li><a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> My Bills</a></li>
      <li><a href="patient-history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg> History</a></li>
      <li><a href="notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>Book an Appointment</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="profile-grid">
        <div class="panel">
          <div class="panel-head"><h2>1. Choose a doctor</h2></div>
          <div id="doctor-list" class="cards-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
            <div class="skeleton skel-row"></div>
            <div class="skeleton skel-row"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>2. Pick a date &amp; submit</h2></div>
          <form id="book-form">
            <div class="field" id="f-doctor">
              <label for="doctor-select">Selected doctor</label>
              <select id="doctor-select" required></select>
              <div class="error-text">Please choose a doctor.</div>
            </div>
            <div class="field" id="f-date">
              <label for="date-input">Preferred date</label>
              <input type="date" id="date-input">
              <div class="error-text">Please pick a valid future date.</div>
            </div>
            <div class="field" id="f-reason">
              <label for="reason-input">Reason for visit</label>
              <textarea id="reason-input" rows="3" placeholder="Briefly describe your symptoms or reason"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="book-btn">Request Appointment</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["PATIENT"]);
let doctors = [];
let myPatientId = null;

if (user) {
  renderUserChip();
  loadNotifBadge();
  init();
}

async function init() {
  try {
    const [patient, doctorList] = await Promise.all([
      api("/patients/me?userId=" + user.userId),
      api("/doctors")
    ]);
    myPatientId = patient.id;
    doctors = doctorList;
    renderDoctorCards();
    populateDoctorSelect();
    const dateInput = document.getElementById("date-input");
    dateInput.min = new Date().toISOString().slice(0, 10);
  } catch (err) {
    toast(err.message, "error");
  }
}

function renderDoctorCards() {
  const el = document.getElementById("doctor-list");
  if (doctors.length === 0) {
    el.innerHTML = `<p>No doctors available right now.</p>`;
    return;
  }
  el.innerHTML = doctors.map(d => `
    <div class="card" style="cursor:pointer;padding:18px;" onclick="selectDoctor(${d.id})" data-doctor-card="${d.id}">
      <div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
      <h3 style="font-size:0.95rem;">${escapeHtml(d.name)}</h3>
      <p style="font-size:0.82rem;">${escapeHtml(d.specialization)}</p>
    </div>`).join("");
}

function populateDoctorSelect() {
  document.getElementById("doctor-select").innerHTML = doctors.map(d =>
    `<option value="${d.id}">${escapeHtml(d.name)} — ${escapeHtml(d.specialization)}</option>`
  ).join("");
}

function selectDoctor(id) {
  document.getElementById("doctor-select").value = id;
  document.querySelectorAll("[data-doctor-card]").forEach(el => {
    el.style.borderColor = el.getAttribute("data-doctor-card") == id ? "var(--blue)" : "var(--line)";
  });
}

document.getElementById("book-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAllErrors(e.target);
  let valid = true;

  const doctorId = document.getElementById("doctor-select").value;
  const date = document.getElementById("date-input").value;

  if (!doctorId) { showFieldError(document.getElementById("f-doctor"), "Please choose a doctor."); valid = false; }
  if (!date) { showFieldError(document.getElementById("f-date"), "Please pick a valid future date."); valid = false; }
  if (!valid) return;

  const payload = {
    patientId: myPatientId,
    doctorId: Number(doctorId),
    date,
    reason: document.getElementById("reason-input").value.trim() || null
  };

  const btn = document.getElementById("book-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    await api("/appointments", { method: "POST", body: payload });
    toast("Appointment requested! You'll see it as pending until approved.", "success");
    setTimeout(() => (window.location.href = "dashboard.html"), 900);
  } catch (err) {
    toast(err.message, "error");
    btn.disabled = false;
    btn.textContent = "Request Appointment";
  }
});
</script>
</body>
</html>

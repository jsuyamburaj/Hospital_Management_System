<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing Staff — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="admin.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2c7be5" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav">
      <li><a href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="patients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Patients</a></li>
      <li><a href="doctors.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg> Doctors</a></li>
      <li><a href="billing-staff.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Billing Staff</a></li>
      <li><a href="appointments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Appointments</a></li>
      <li><a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Billing</a></li>
      <li><a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg> Reports</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>Billing Staff</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="panel">
        <div class="panel-head">
          <h2>Billing staff accounts</h2>
          <button class="btn btn-primary btn-sm" id="add-staff-btn">+ Add Billing Staff</button>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
            <tbody id="staff-body"><tr><td colspan="3"><div class="skeleton skel-row"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="staff-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Billing Staff</h3>
      <button class="modal-close" data-close-modal="staff-modal">&times;</button>
    </div>
    <form id="staff-form">
      <div class="field" id="f-s-name">
        <label for="s-name">Full name</label>
        <input type="text" id="s-name" placeholder="Jordan Lee">
        <div class="error-text">Name is required.</div>
      </div>
      <div class="field" id="f-s-email">
        <label for="s-email">Email (used to log in)</label>
        <input type="email" id="s-email" placeholder="billing@medicore.com">
        <div class="error-text">A valid email is required.</div>
      </div>
      <div class="field" id="f-s-password">
        <label for="s-password">Login Password</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="s-password" placeholder="At least 6 characters" autocomplete="new-password" class="has-toggle">
          <button type="button" class="password-toggle" data-toggle-password="s-password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error-text">Password must be at least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="staff-save-btn">Create Account</button>
    </form>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["ADMIN"]);
let allStaff = [];

if (user) {
  renderUserChip();
  loadStaff();
}

async function loadStaff() {
  try {
    allStaff = await api("/staff/billing");
    renderStaff();
  } catch (err) {
    toast(err.message, "error");
  }
}

function renderStaff() {
  const body = document.getElementById("staff-body");
  if (allStaff.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="3">No billing staff accounts yet.</td></tr>`;
    return;
  }
  body.innerHTML = allStaff.map(s => `<tr>
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.email)}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn danger" onclick="deleteStaff(${s.id})" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
          </button>
        </div>
      </td>
    </tr>`).join("");
}

document.getElementById("add-staff-btn").addEventListener("click", () => {
  document.getElementById("staff-form").reset();
  clearAllErrors(document.getElementById("staff-form"));
  openModal("staff-modal");
});

async function deleteStaff(id) {
  if (!confirm("Remove this billing staff account? This cannot be undone.")) return;
  try {
    await api(`/staff/billing/${id}`, { method: "DELETE" });
    toast("Account removed.", "success");
    loadStaff();
  } catch (err) {
    toast(err.message, "error");
  }
}

document.getElementById("staff-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAllErrors(e.target);

  const name = document.getElementById("s-name").value.trim();
  const email = document.getElementById("s-email").value.trim();
  const password = document.getElementById("s-password").value;

  let valid = true;
  if (!name) { showFieldError(document.getElementById("f-s-name"), "Name is required."); valid = false; }
  if (!/^\S+@\S+\.\S+$/.test(email)) { showFieldError(document.getElementById("f-s-email"), "A valid email is required."); valid = false; }
  if (password.length < 6) { showFieldError(document.getElementById("f-s-password"), "Password must be at least 6 characters."); valid = false; }
  if (!valid) return;

  const btn = document.getElementById("staff-save-btn");
  btn.disabled = true;
  try {
    await api("/staff/billing", { method: "POST", body: { name, email, password } });
    toast("Billing staff account created.", "success");
    closeModal("staff-modal");
    loadStaff();
  } catch (err) {
    toast(err.message, "error");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2c7be5" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4.5 4.5 8.5C19 16.65 12 21 12 21z"/></svg>
      MediCore
    </a>
    <ul class="side-nav">
      <li><a href="dashboard.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Dashboard</a></li>
      <li><a href="appointment-book.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Book Appointment</a></li>
      <li><a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> My Bills</a></li>
      <li><a href="patient-history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg> History</a></li>
      <li><a href="notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications</a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <a href="#" class="btn btn-ghost btn-sm btn-block logout-btn" style="margin-top:8px;justify-content:flex-start;">Log out</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle">☰</button>
        <h1>My Dashboard</h1>
      </div>
      <button class="dark-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="page-body">
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card blue"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card green"><div class="skeleton" style="height:70px;"></div></div>
        <div class="stat-card warning"><div class="skeleton" style="height:70px;"></div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>My Appointments</h2>
          <a href="appointment-book.html" class="btn btn-primary btn-sm">+ Book New</a>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Doctor</th><th>Date</th><th>Reason</th><th>Status</th></tr></thead>
            <tbody id="appointments-body"><tr><td colspan="4"><div class="skeleton skel-row"></div></td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Recent Bills</h2>
          <a href="billing.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Amount</th><th>Date</th><th>Description</th><th>Status</th></tr></thead>
            <tbody id="billing-body"><tr><td colspan="4"><div class="skeleton skel-row"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const user = Auth.requireRole(["PATIENT"]);
if (user) {
  renderUserChip();
  loadNotifBadge();
  loadPatientDashboard();
}

async function loadPatientDashboard() {
  try {
    const patient = await api("/patients/me?userId=" + user.userId);
    const [appointments, billings] = await Promise.all([
      api(`/appointments/patient/${patient.id}`),
      api(`/billing/patient/${patient.id}`)
    ]);

    const unpaidCount = billings.filter(b => b.status === "UNPAID").length;
    document.getElementById("stat-cards").innerHTML = `
      <div class="stat-card blue">
        <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div></div>
        <div class="value">${appointments.length}</div><div class="label">Appointments</div>
      </div>
      <div class="stat-card green">
        <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg></div></div>
        <div class="value">${patient.disease ? escapeHtml(patient.disease) : "—"}</div><div class="label">On File</div>
      </div>
      <div class="stat-card ${unpaidCount > 0 ? 'warning' : 'green'}">
        <div class="top-row"><div class="icon-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div></div>
        <div class="value">${unpaidCount}</div><div class="label">Unpaid Bills</div>
      </div>`;

    let doctors = [];
    try { doctors = await api("/doctors"); } catch {}

    const apptBody = document.getElementById("appointments-body");
    apptBody.innerHTML = appointments.length === 0
      ? `<tr class="empty-row"><td colspan="4">No appointments yet. <a href="appointment-book.html">Book one now</a>.</td></tr>`
      : [...appointments].sort((a,b) => b.id - a.id).map(a => {
          const doctor = doctors.find(d => d.id === a.doctorId);
          return `<tr>
            <td>${doctor ? escapeHtml(doctor.name) : "Doctor #" + a.doctorId}</td>
            <td>${formatDate(a.date)}</td>
            <td>${a.reason ? escapeHtml(a.reason) : "—"}</td>
            <td><span class="badge ${statusBadgeClass(a.status)}">${a.status.toLowerCase()}</span></td>
          </tr>`;
        }).join("");

    const billBody = document.getElementById("billing-body");
    billBody.innerHTML = billings.length === 0
      ? `<tr class="empty-row"><td colspan="4">No bills on file yet.</td></tr>`
      : [...billings].sort((a,b) => b.id - a.id).slice(0, 6).map(b => `<tr>
          <td>${formatCurrency(b.amount)}</td><td>${formatDate(b.date)}</td>
          <td>${b.description ? escapeHtml(b.description) : "—"}</td>
          <td><span class="badge ${statusBadgeClass(b.status)}">${b.status.toLowerCase()}</span></td>
        </tr>`).join("");
  } catch (err) {
    toast(err.message, "error");
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — MediCore HMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-blob b1"></div>
  <div class="auth-blob b2"></div>
  <div class="auth-blob b3"></div>

  <div class="auth-card-wrap">
    <a href="index.html" class="auth-brand-row">
      <div class="brand-logo-badge" style="width:30px;height:30px;border-radius:8px;background:var(--primary-teal);display:inline-flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      </div>
      <span>Hospital Management System</span>
    </a>
    <svg class="auth-ekg-divider" viewBox="0 0 260 50" preserveAspectRatio="none">
      <path d="M0 25 L45 25 L58 25 L68 6 L82 44 L92 25 L118 25 L130 12 L142 25 L260 25"/>
    </svg>

    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to reach your dashboard.</p>

      <form id="login-form" novalidate>
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
          </div>
          <div class="error-text">Please enter a valid email.</div>
        </div>
        <div class="field" id="f-password">
          <label for="password">Password</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" class="has-toggle">
            <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="error-text">Please enter your password.</div>
        </div>
        <div class="form-links-row">
          <span></span>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span id="login-btn-text">Log In</span>
        </button>
      </form>

      <p class="form-foot">Don't have an account? <a href="register.html">Create one</a></p>
      <p class="form-foot" style="margin-top:6px;font-size:0.8rem;">Demo admin: admin@hms.com / Admin@123</p>
    </div>

    <div class="auth-feature-chips">
      <span>Role-based dashboards</span>
      <span>Live billing status</span>
      <span>Encrypted records</span>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
if (Auth.isLoggedIn()) Auth.redirectToDashboard();

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  clearAllErrors(form);
  let valid = true;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!/^\S+@\S+\.\S+$/.test(email)) { showFieldError(document.getElementById("f-email"), "Please enter a valid email."); valid = false; }
  if (!password) { showFieldError(document.getElementById("f-password"), "Please enter your password."); valid = false; }
  if (!valid) return;

  const btn = document.getElementById("login-btn");
  const btnText = document.getElementById("login-btn-text");
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';

  try {
    const res = await api("/auth/login", { method: "POST", body: { email, password }, auth: false });
    Auth.setSession(res);
    toast(`Welcome back, ${res.name.split(" ")[0]}!`, "success");
    setTimeout(() => Auth.redirectToDashboard(), 500);
  } catch (err) {
    toast(err.message, "error");
    btn.disabled = false;
    btnText.textContent = "Log In";
  }
});
</script>
</body>
</html>

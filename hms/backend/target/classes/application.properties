# ================= SERVER =================
server.port=8080

# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://localhost:3306/hms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ================= JWT =================
# 256-bit secret used to sign JWT tokens - change this in production
jwt.secret=hms_super_secret_key_for_jwt_signing_change_in_production_1234567890
jwt.expiration.ms=86400000

# ================= LOGGING =================
logging.level.org.springframework.security=INFO
logging.level.com.hms=DEBUG

# ================= CORS =================
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

# ================= SERVER =================
server.port=8080

# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hms2_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ================= JWT =================
# 256-bit secret used to sign JWT tokens - change this in production
jwt.secret=hms_super_secret_key_for_jwt_signing_change_in_production_1234567890
jwt.expiration.ms=86400000

# ================= LOGGING =================
logging.level.org.springframework.security=WARN
logging.level.com.hms=INFO

# ================= CORS =================
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000

# ================= REQUEST SIZE =================
# Profile photos are sent as base64 JSON, not multipart, but raised anyway
# as a safety margin (frontend already resizes images before upload).
server.tomcat.max-http-form-post-size=8MB
server.tomcat.max-swallow-size=8MB
